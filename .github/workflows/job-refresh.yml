name: Job refresh

on:
  workflow_dispatch:   # lets you run it manually from the Actions tab to test

permissions:
  contents: write      # needed to commit the updated Excel file

concurrency:
  group: job-refresh   # never run two refreshes at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run job refresh
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TRACKER_PATH: Job_Tracker_Mumbai_Java.xlsx
        run: python job_refresh.py

      - name: Commit updated tracker
        run: |
          git config user.name "job-refresh-bot"
          git config user.email "job-refresh-bot@users.noreply.github.com"
          git add Job_Tracker_Mumbai_Java.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Job refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
